name: Publish Package to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 5.0.0). Defaults to the version in package.json.'
        required: false
        type: string

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Full history so the version sync-back can fast-forward master.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build package
        run: yarn build
      # The published version is derived from the release tag (the source of
      # truth for a release) so a forgotten package.json bump can never silently
      # re-publish the previous version again. Falls back to the workflow_dispatch
      # input, then to whatever is already in package.json.
      - name: Resolve version to publish
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing @cr34tics/exceljs@$VERSION"
      - name: Set package version
        # npm pkg set only rewrites the version field; it does NOT run the
        # preversion/postversion lifecycle hooks (which build, test and git push).
        run: npm pkg set version="${{ steps.version.outputs.version }}"
      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Keep the committed package.json in sync with what was just published, so a
      # release cut without a prior version bump doesn't leave master behind.
      # Runs only after a successful release publish. A push race here is
      # non-fatal: the package is already published, which is what matters.
      - name: Sync package.json version back to master
        if: github.event_name == 'release'
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch origin master
          git checkout -f -B release-sync FETCH_HEAD
          npm pkg set version="$VERSION"
          if git diff --quiet -- package.json; then
            echo "master already at $VERSION; nothing to sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): sync package.json to $VERSION [skip ci]" -- package.json
          git push origin HEAD:master
