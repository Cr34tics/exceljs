name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: ['**']

env:
  CI: true

jobs:
  test:
    timeout-minutes: 15
    name: Node v${{ matrix.node-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, macOS-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set git config
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
        if: runner.os == 'Windows'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Enable Corepack
        # Node 26 bundles a Corepack that fails to shim over the runner's global
        # Yarn 1.x on Windows ("current global version of Yarn is 1.22.22").
        # Install the latest Corepack so its yarn shim reliably takes precedence.
        run: |
          npm install -g corepack@latest
          corepack enable
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn test:unit
      - run: yarn test:integration
      - run: yarn test:end-to-end
      # The browser bundle is an OS- and Node-version-agnostic artifact, so
      # validate it once: headless Chromium on Linux with a single Node version.
      # Downloading the Playwright browser is slow and prone to CDN-stall hangs
      # (seen on macOS/Windows, and under Node 26 on Linux too), so we keep it off
      # the rest of the matrix.
      - run: yarn playwright install chromium
        if: runner.os == 'Linux' && matrix.node-version == '24.x'
      - run: yarn test:browser:run
        if: runner.os == 'Linux' && matrix.node-version == '24.x'

  benchmark:
    timeout-minutes: 15
    name: Measure performance impact of changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
      - name: Enable Corepack
        # Node 26 bundles a Corepack that fails to shim over the runner's global
        # Yarn 1.x on Windows ("current global version of Yarn is 1.22.22").
        # Install the latest Corepack so its yarn shim reliably takes precedence.
        run: |
          npm install -g corepack@latest
          corepack enable
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - run: yarn install --immutable
      - run: yarn benchmark

  typescript:
    timeout-minutes: 15
    name: Ensure typescript compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
      - name: Enable Corepack
        # Node 26 bundles a Corepack that fails to shim over the runner's global
        # Yarn 1.x on Windows ("current global version of Yarn is 1.22.22").
        # Install the latest Corepack so its yarn shim reliably takes precedence.
        run: |
          npm install -g corepack@latest
          corepack enable
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - run: yarn install --immutable
      - run: yarn tsc --noEmit -p tsconfig.check-types.json

  lint:
    timeout-minutes: 15
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
      - name: Enable Corepack
        # Node 26 bundles a Corepack that fails to shim over the runner's global
        # Yarn 1.x on Windows ("current global version of Yarn is 1.22.22").
        # Install the latest Corepack so its yarn shim reliably takes precedence.
        run: |
          npm install -g corepack@latest
          corepack enable
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - run: yarn install --immutable
      - run: yarn lint
