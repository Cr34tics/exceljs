nodeLinker: node-modules

# Keep the package cache inside the repo (./.yarn/cache) so CI can cache it directly.
enableGlobalCache: false

# Supply-chain gate: refuse any package version whose npm publish date is newer than
# 7 days, on every install (direct and transitive). Requires Yarn >= 4.10.
# Mirrors the Renovate `minimumReleaseAge: "7 days"` PR-time gate.
# Add exact locators / name globs to npmPreapprovedPackages to bypass when needed.
npmMinimalAgeGate: "7d"
